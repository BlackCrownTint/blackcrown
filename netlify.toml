# Netlify build config for the Astro static site.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Astro outputs per-page index.html under clean folders; Netlify serves them
# directly. This catch-all only returns the 404 page for truly missing paths.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
